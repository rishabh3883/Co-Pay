[build]
  publish = "client/dist"
  command = "npm --prefix client run build"

[functions]
  directory = "netlify/functions"

# 1. Specific API endpoints
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/homes/join"
  to = "/.netlify/functions/join"
  status = 200

[[redirects]]
  from = "/api/homes"
  to = "/.netlify/functions/homes"
  status = 200

[[redirects]]
  from = "/api/homes/*"
  to = "/.netlify/functions/homes"
  status = 200

[[redirects]]
  from = "/api/expenses"
  to = "/.netlify/functions/expenses"
  status = 200

[[redirects]]
  from = "/api/expenses/*"
  to = "/.netlify/functions/expenses"
  status = 200

# Catch-all redirect for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
